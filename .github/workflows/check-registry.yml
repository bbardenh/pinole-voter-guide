name: Check contest list (manual)

# Builds the contest list from the live county and Secretary of State documents (no model, nothing saved) and
# prints how it differs from config/contests/2026-11-03.yaml. Use it to confirm the Contra Costa PDF parsing works.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/compare_registry.py
