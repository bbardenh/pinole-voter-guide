name: Extract all orgs (manual)

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Optional comma-separated org ids (blank = all)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Extract
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python tools/extract_all.py --workers 3 --max-pages 3 --only "${{ inputs.only }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extractions
          path: out/extractions.json
