name: Extract test (manual)

on:
  workflow_dispatch:
    inputs:
      orgs:
        description: "Comma-separated org ids from config/orgs.yaml"
        required: true
        default: "contra-costa-labor-council,west-county-dem-club"

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Extract
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python tools/extract_org.py "${{ inputs.orgs }}"
