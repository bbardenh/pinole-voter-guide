name: Sheet admin (manual)

on:
  workflow_dispatch:
    inputs:
      tab:
        description: "Tab to delete (must be on the allow-list in tools/sheet_admin.py)"
        required: true

permissions:
  contents: read

jobs:
  delete-tab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Delete tab
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          SHEET_ID: ${{ vars.SHEET_ID }}
        run: python tools/sheet_admin.py delete-tab "${{ inputs.tab }}"
